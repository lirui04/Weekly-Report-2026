<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>58招聘·双模式套餐报价单生成器</title>
<style>
  :root {
    --primary: #1a6fff; --primary-dark: #0050d8; --primary-light: #e8f0ff;
    --accent: #ff6b35; --accent-light: #fff3ed;
    --success: #00b42a; --success-light: #e8ffea;
    --warning: #ff7d00; --warning-light: #fff7e8;
    --danger: #f53f3f; --danger-light: #ffece8;
    --bg: #f5f7fa; --card: #ffffff;
    --text: #1d2129; --text-2: #4e5969; --text-3: #86909c;
    --border: #e5e6eb; --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.08); --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .header { background: linear-gradient(135deg, #1a6fff 0%, #0050d8 50%, #0a3ab5 100%); color: #fff; padding: 24px 40px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(26,111,255,0.3); }
  .header-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  .header h1 span { font-weight: 400; opacity: 0.85; font-size: 14px; margin-left: 12px; }
  .header-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .header-badge:hover { background: rgba(255,255,255,0.25); }
  .main { max-width: 1440px; margin: 0 auto; padding: 24px 40px 60px; }

  /* Stats */
  .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px 24px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; min-width: 180px; flex: 1; }
  .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
  .stat-icon.orange { background: var(--accent-light); color: var(--accent); }
  .stat-icon.green { background: var(--success-light); color: var(--success); }
  .stat-label { font-size: 12px; color: var(--text-3); }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }

  /* Tabs */
  .tabs-wrapper { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .tabs-nav { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs-nav::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 14px 28px; font-size: 15px; color: var(--text-2); cursor: pointer; border: none; background: none; white-space: nowrap; position: relative; transition: all 0.2s; font-weight: 500; }
  .tab-btn:hover { color: var(--primary); background: var(--primary-light); }
  .tab-btn.active { color: var(--primary); font-weight: 600; }
  .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20px; right: 20px; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }
  .tab-btn .badge { font-size: 11px; background: var(--primary-light); color: var(--primary); padding: 1px 8px; border-radius: 10px; margin-left: 6px; font-weight: 600; }

  /* Sub-tabs (new/renew filter) */
  .sub-tabs-bar { display: flex; gap: 8px; padding: 10px 20px; background: #f7f8fa; border-bottom: 1px solid var(--border); }
  .sub-tab-btn { padding: 6px 18px; border-radius: 16px; font-size: 13px; border: 1px solid var(--border); background: #fff; color: var(--text-2); cursor: pointer; transition: all 0.2s; }
  .sub-tab-btn:hover { border-color: var(--primary); color: var(--primary); }
  .sub-tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 500; }

  /* 2x2 Grid layout */
  .content-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1200px) { .content-area { grid-template-columns: 1fr; } }

  .grid-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .grid-card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .grid-card-body { padding: 0; flex: 1; overflow: hidden; }

  /* Package list */
  .package-list { border-radius: var(--radius); overflow: hidden; }
  .package-list-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .package-list-header h3 { font-size: 16px; font-weight: 600; }
  .filter-row { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #fafbfc; }
  .filter-btn { padding: 5px 14px; border-radius: 16px; font-size: 12px; border: 1px solid var(--border); background: #fff; color: var(--text-2); cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .package-scroll { max-height: 420px; overflow-y: auto; }
  .package-scroll::-webkit-scrollbar { width: 6px; }
  .package-scroll::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }

  /* Package card */
  .pkg-card { padding: 18px 24px; border-bottom: 1px solid #f2f3f5; cursor: pointer; transition: all 0.2s; position: relative; }
  .pkg-card:hover { background: #f8faff; }
  .pkg-card.selected { background: var(--primary-light); border-left: 3px solid var(--primary); }
  .pkg-card .check-mark {
    position: absolute; top: 18px; right: 20px; width: 24px; height: 24px;
    border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: transparent; transition: all 0.2s; background: #fff;
  }
  .pkg-card.selected .check-mark { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pkg-card .select-num {
    position: absolute; top: 18px; right: 20px; width: 24px; height: 24px;
    background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .pkg-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; padding-right: 36px; }
  .pkg-name { font-size: 15px; font-weight: 600; color: var(--text); max-width: 70%; line-height: 1.4; }
  .pkg-price { font-size: 22px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .pkg-price small { font-size: 13px; font-weight: 400; color: var(--text-3); }
  .pkg-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pkg-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .tag-tier { background: #e8f7ff; color: #0fc6c2; }
  .tag-type { background: #fff7e8; color: #ff7d00; }
  .tag-scope { background: #f2f3f5; color: var(--text-2); }
  .tag-coop { background: #e8ffea; color: #00b42a; }
  .pkg-details { display: flex; gap: 6px; flex-wrap: wrap; }
  .pkg-detail-item { font-size: 12px; color: var(--text-3); background: #f7f8fa; padding: 2px 8px; border-radius: 4px; }
  .pkg-detail-item b { color: var(--text-2); font-weight: 600; }

  /* Config panel */
  .config-panel { display: flex; flex-direction: column; gap: 20px; }
  .panel-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .panel-card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel-card-body { padding: 16px; }
  .selected-count { font-size: 12px; background: var(--primary); color: #fff; padding: 1px 8px; border-radius: 10px; margin-left: auto; }
  .selected-count.full { background: var(--warning); }

  /* Selected items list */
  .sel-list { max-height: 320px; overflow-y: auto; }
  .sel-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: #f7f8fa; font-size: 13px; position: relative; }
  .sel-item .sel-num { width: 22px; height: 22px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .sel-item .sel-info { flex: 1; min-width: 0; }
  .sel-item .sel-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-item .sel-meta { font-size: 11px; color: var(--text-3); }
  .sel-item .sel-price { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .sel-item .sel-remove { width: 20px; height: 20px; border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sel-item .sel-remove:hover { background: var(--danger-light); color: var(--danger); }
  .sel-empty { text-align: center; padding: 24px; color: var(--text-3); font-size: 13px; }

  /* Compare table */
  .compare-section { margin-top: 16px; }
  .compare-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .compare-table th { background: #f7f8fa; padding: 8px 10px; text-align: left; font-weight: 600; color: var(--text-2); border: 1px solid var(--border); position: sticky; top: 0; }
  .compare-table th:first-child { min-width: 80px; }
  .compare-table td { padding: 8px 10px; border: 1px solid var(--border); }
  .compare-table tr:nth-child(even) td { background: #fafbfc; }
  .compare-table .best { background: var(--success-light) !important; font-weight: 600; color: var(--success); }
  .compare-table .highlight { background: var(--accent-light) !important; font-weight: 600; color: var(--accent); }
  .compare-legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-3); margin-top: 8px; }
  .compare-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .compare-legend .legend-best::before { background: var(--success-light); }
  .compare-legend .legend-high::before { background: var(--accent-light); }

  /* Upload */
  .upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .upload-area:hover { border-color: var(--primary); background: var(--primary-light); }
  .upload-area.has-image { border-style: solid; padding: 8px; }
  .upload-icon { font-size: 36px; color: var(--text-3); margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--text-3); }
  .upload-text strong { color: var(--primary); }
  .upload-preview { max-width: 100%; max-height: 180px; border-radius: 6px; object-fit: contain; }
  .upload-remove { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  #fileInput { display: none; }
  .preset-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .preset-images-label { font-size: 12px; color: var(--text-3); width: 100%; margin-bottom: 2px; }
  .preset-img-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border); cursor: pointer; transition: all 0.2s; }
  .preset-img-thumb:hover { border-color: var(--primary); transform: scale(1.05); }
  .preset-img-thumb.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }

  /* Forms */
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .form-group { flex: 1; }
  .form-group label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); transition: border-color 0.2s; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,111,255,0.1); }
  .form-group textarea { resize: vertical; min-height: 60px; }

  /* Version toggle */
  .version-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .version-btn { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; text-align: center; transition: all 0.2s; }
  .version-btn:hover { border-color: var(--primary); }
  .version-btn.active { border-color: var(--primary); background: var(--primary-light); }
  .version-btn .v-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .version-btn .v-desc { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .version-btn.active .v-title { color: var(--primary); }

  /* Generate button */
  .btn-generate { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
  .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,111,255,0.35); }
  .btn-generate:active { transform: translateY(0); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-clear { width: 100%; padding: 10px; background: #fff; color: var(--text-3); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .btn-clear:hover { border-color: var(--danger); color: var(--danger); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-overlay.show { display: flex; }
  .modal-content { background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 860px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 10; border-radius: 16px 16px 0 0; }
  .modal-header h2 { font-size: 18px; }
  .modal-close { width: 36px; height: 36px; border: none; background: #f2f3f5; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text-2); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .modal-close:hover { background: #e5e6eb; }
  .modal-body { padding: 0; }
  .modal-actions { padding: 16px 28px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--card); border-radius: 0 0 16px 16px; }
  .btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); background: #fff; color: var(--text-2); }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); }

  /* Quotation */
  .quotation { background: #fff; position: relative; }
  .quot-header-img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .quot-header-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, #1a6fff 0%, #0050d8 50%, #0a3ab5 100%); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.9); font-size: 32px; font-weight: 700; letter-spacing: 8px; }
  .quot-body { padding: 36px 44px; }
  .quot-title-row { text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 2px solid var(--primary); }
  .quot-main-title { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 3px; margin-bottom: 6px; }
  .quot-sub-title { font-size: 14px; color: var(--text-3); }
  .quot-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; margin-bottom: 28px; font-size: 13px; }
  .quot-info-item { display: flex; gap: 8px; }
  .quot-info-label { color: var(--text-3); min-width: 70px; }
  .quot-info-value { color: var(--text); font-weight: 500; }
  .quot-section-title { font-size: 16px; font-weight: 700; color: var(--primary); padding: 10px 0; border-bottom: 2px solid var(--primary-light); margin: 24px 0 16px; display: flex; align-items: center; gap: 8px; }
  .quot-section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }
  .quot-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
  .quot-table th { background: #f7f8fa; padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-2); border: 1px solid #e5e6eb; white-space: nowrap; }
  .quot-table td { padding: 10px 14px; border: 1px solid #e5e6eb; color: var(--text); }
  .quot-table tr:nth-child(even) td { background: #fafbfc; }
  .quot-price-highlight { text-align: center; margin: 28px 0; padding: 20px; background: linear-gradient(135deg, #fff7e8 0%, #fff1d6 100%); border-radius: 12px; border: 1px solid #ffe4ba; }
  .quot-price-label { font-size: 14px; color: var(--text-3); margin-bottom: 4px; }
  .quot-price-value { font-size: 38px; font-weight: 700; color: var(--accent); }
  .quot-price-value small { font-size: 16px; font-weight: 400; }
  .quot-remark { margin-top: 24px; padding: 16px 20px; background: #f7f8fa; border-radius: 8px; font-size: 12px; color: var(--text-3); line-height: 1.8; }
  .quot-remark strong { color: var(--text-2); }
  .quot-footer { margin-top: 36px; padding-top: 20px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); }
  .quot-stamp { text-align: right; margin-top: 24px; padding-top: 16px; }
  .quot-stamp-box { display: inline-block; border: 2px solid #ccc; color: #ccc; padding: 8px 24px; border-radius: 4px; font-size: 14px; font-weight: 600; letter-spacing: 4px; transform: rotate(-8deg); }

  /* Multi-pkg quote cards (≤2: inline, 3+: hidden, use table instead) */
  .quot-pkg-cards { display: flex; gap: 16px; margin: 16px 0; flex-wrap: nowrap; }
  .quot-pkg-cards.cards-wrap { display: flex; }
  .quot-pkg-cards.cards-wrap .quot-pkg-card { flex: 1; min-width: 0; }
  .quot-pkg-card { border: 2px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .quot-pkg-card .qpc-num { position: absolute; top: -10px; left: 16px; background: var(--primary); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .quot-pkg-card .qpc-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; padding-top: 4px; }
  .quot-pkg-card .qpc-meta { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
  .quot-pkg-card .qpc-price { font-size: 28px; font-weight: 700; color: var(--accent); text-align: center; margin: 12px 0; }
  .quot-pkg-card .qpc-price small { font-size: 13px; font-weight: 400; color: var(--text-3); }
  .quot-pkg-card .qpc-details { font-size: 12px; color: var(--text-3); line-height: 1.8; }
  .quot-pkg-card .qpc-details b { color: var(--text-2); }

  /* Product intro in detailed quote */
  .product-intro { margin-top: 32px; padding: 24px; background: #fafbfc; border-radius: 12px; border: 1px solid var(--border); }
  .product-intro h3 { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
  .product-intro-item { margin-bottom: 16px; }
  .product-intro-item h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .product-intro-item p { font-size: 13px; color: var(--text-2); line-height: 1.8; }

  /* Quotation compare table (3+ packages) */
  .quot-compare-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
  .quot-compare-table th { background: var(--primary); color: #fff; padding: 12px 14px; text-align: center; font-weight: 600; border: 1px solid var(--primary-dark); white-space: nowrap; }
  .quot-compare-table th:first-child { background: var(--primary-dark); text-align: left; min-width: 120px; position: sticky; left: 0; z-index: 2; }
  .quot-compare-table td { padding: 10px 14px; border: 1px solid #e5e6eb; text-align: center; color: var(--text); vertical-align: top; }
  .quot-compare-table td:first-child { text-align: left; font-weight: 600; color: var(--text-2); background: #f7f8fa; position: sticky; left: 0; z-index: 1; }
  .quot-compare-table tr:nth-child(even) td { background: #fafbfc; }
  .quot-compare-table tr:nth-child(even) td:first-child { background: #f0f1f3; }
  .quot-compare-table .ct-best { background: var(--success-light) !important; font-weight: 700; color: var(--success); }
  .quot-compare-table .ct-price { background: #fff7e8 !important; font-weight: 700; color: var(--accent); font-size: 16px; }
  .quot-compare-table .ct-cat-row td { background: var(--primary-light); font-weight: 600; color: var(--primary); text-align: left; }

      </div>
    </div>
    <!-- Bottom-Left: Customer Info -->
    <div class="grid-card">
      <div class="grid-card-header">&#x1F465; 客户信息</div>

        <div class="form-row">
          <div class="form-group"><label>客户名称</label><input type="text" id="clientName" placeholder="请输入客户/公司名称"></div>

function renderStats() {
  let total=0, minP=Infinity, maxP=0;
  for (const c in PKG_DATA) for (const s of PKG_DATA[c]) for (const i of s.items) {
    if (i.price) { total++; if(i.price<minP) minP=i.price; if(i.price>maxP) maxP=i.price; }
  }
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-icon blue">&#x1F4E6;</div><div><div class="stat-label">套餐总数</div><div class="stat-value">${total}</div></div></div>
    <div class="stat-card"><div class="stat-icon orange">&#x1F3AF;</div><div><div class="stat-label">覆盖分类</div><div class="stat-value">${CATEGORIES.length}</div></div></div>
    <div class="stat-card"><div class="stat-icon green">&#x1F4B0;</div><div><div class="stat-label">价格区间</div><div class="stat-value">&yen;${minP}~${maxP>=10000?(maxP/10000).toFixed(1)+'万':maxP}</div></div></div>`;
}

function renderTabs() {
  // Main category tabs
  let html = CATEGORIES.map(c => {
    const cnt = c.subTabs.reduce((sum, st) => sum + (PKG_DATA[st]?.reduce((s,sec)=>s+sec.items.length,0)||0), 0);
    return `<button class="tab-btn ${currentTab===c.id?'active':''}" data-tab="${c.id}" onclick="switchTab('${c.id}')">${c.icon} ${c.name} <span class="badge">${cnt}</span></button>`;
  }).join('');
  document.getElementById('tabsNav').innerHTML = html;
}

function switchTab(tabId) {
  currentTab = tabId;
  const cat = CATEGORIES.find(c => c.id === tabId);
  // Default to first sub-tab
  currentSubTab = cat.subTabs[0];
  renderTabs(); // re-render to update active state
  renderTabContent(tabId);
}

function switchSubTab(subTabId) {
  currentSubTab = subTabId;

}

  const sections = PKG_DATA[currentSubTab];
  if (!sections) { container.innerHTML = subTabHtml + '<div class="empty-state">暂无数据</div>'; return; }

  if (tabId === 'coin') {

      <strong>适用对象：</strong>服务中的58招聘会员客户（不含赶集招聘会员/全网招2.0会员/框架VIP7会员客户）<br>

          const isSel = selectedPkgs.some(p => p._uid === 'coin-'+idx);
          return `<tr><td>${item.range}</td><td style="color:var(--accent);font-weight:700;">${item.rebate}</td><td>${item.validity}</td>
            <td><button class="filter-btn ${isSel?'active':''}" onclick="toggleCoinPolicy(${idx})">${isSel?'&#x2713; 已选':'选择'}</button></td></tr>`;
        }).join('')}</tbody>
      </table></div>`;

  let allTiers = new Set();
  sections.forEach(s => s.items.forEach(i => allTiers.add(i.tier)));

// === MULTI-SELECT LOGIC ===
function togglePackage(tabId, section, idx) {
  const uid = tabId+'-'+section+'-'+idx;
  const existIdx = selectedPkgs.findIndex(p => p._uid === uid);
  if (existIdx >= 0) {
    selectedPkgs.splice(existIdx, 1);
    showToast('已取消选择');
  } else {
    const isCoin = (tabId === 'coin');
    const max = isCoin ? MAX_COIN : MAX_PKG;
    const coinCount = selectedPkgs.filter(p => p._tab === 'coin').length;
    const pkgCount = selectedPkgs.filter(p => p._tab !== 'coin').length;
    if (isCoin && coinCount >= max) { showToast('招聘币最多选' + max + '档'); return; }
    if (!isCoin && pkgCount >= max) { showToast('套餐最多选' + max + '款'); return; }
    const sec = PKG_DATA[tabId].find(s => s.section === section);
    if (!sec) return;
    const item = sec.items[idx];
    const catName = CATEGORIES.find(c => c.subTabs.includes(tabId))?.name || tabId;
    selectedPkgs.push({ ...item, _uid: uid, _tab: tabId, _section: section, _idx: idx, _category: catName });
    showToast('已选择：' + (item.name || item.range || '') + (item.price ? ' ¥' + item.price.toLocaleString() : ''));
  }
  updateSelectedPanel();
  document.getElementById('btnGenerate').disabled = selectedPkgs.length === 0;
  renderTabContent(currentTab);
}

function toggleCoinPolicy(idx) { togglePackage(currentSubTab, '招聘币单充政策', idx); }

function removeSelected(uid) {
  selectedPkgs = selectedPkgs.filter(p => p._uid !== uid);
  updateSelectedPanel();
  document.getElementById('btnGenerate').disabled = selectedPkgs.length === 0;
  renderTabContent(currentTab);
}

function clearSelection() {
  selectedPkgs = [];
  updateSelectedPanel();
  document.getElementById('btnGenerate').disabled = true;
  renderTabContent(currentTab);
  showToast('已清空所有选择');
}

// === SELECTED PANEL ===
function updateSelectedPanel() {
  const el = document.getElementById('selectedContent');
  const countEl = document.getElementById('selCount');
  const coinCount = selectedPkgs.filter(p => p._tab === 'coin').length;
  const pkgCount = selectedPkgs.filter(p => p._tab !== 'coin').length;

  if (selectedPkgs.length === 0) {
    el.innerHTML = '<div class="sel-empty">请从左侧列表选择套餐（最多5款，方便对比）</div>';
    countEl.textContent = '0/5';
    countEl.classList.remove('full');
    document.getElementById('compareSection').style.display = 'none';
    return;
  }

  if (pkgCount >= MAX_PKG || coinCount >= MAX_COIN) { countEl.classList.add('full'); } else { countEl.classList.remove('full'); }
  countEl.textContent = selectedPkgs.length + '/' + (pkgCount > 0 && coinCount > 0 ? MAX_PKG + MAX_COIN : MAX_PKG);

  let html = '<div class="sel-list">';
  selectedPkgs.forEach((p, i) => {
    const isCoin = p._tab === 'coin';
    html += `<div class="sel-item">
      <div class="sel-num">${i+1}</div>
      <div class="sel-info">
        <div class="sel-name">${isCoin ? '招聘币 ' + p.range : p.name}</div>
        <div class="sel-meta">${p._category}${isCoin ? ' · 返比' + p.rebate : ' · ' + p.tier + ' · ' + p.type}</div>
      </div>
      <div class="sel-price">${isCoin ? p.rebate : '&yen;' + p.price.toLocaleString()}</div>
      <button class="sel-remove" onclick="removeSelected('${p._uid}')" title="移除">&times;</button>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;

  // Build compare table when 2+ items selected
  if (selectedPkgs.length >= 2) {
    buildCompareTable();
  } else {
    document.getElementById('compareSection').style.display = 'none';
  }
}

function buildCompareTable() {
  const section = document.getElementById('compareSection');
  section.style.display = 'block';

  const pkgs = selectedPkgs.filter(p => p._tab !== 'coin');
  const coins = selectedPkgs.filter(p => p._tab === 'coin');

  let html = '<div class="compare-title">&#x1F4CA; 差异对比</div>';

  // Package comparison
  if (pkgs.length >= 2) {
    const fields = [
      ['价格', 'price', true], ['服务时长', 'duration', false],
      ['权益包', 'pkg_count', true], ['劲爆职位点', 'hot_points', true],
      ['主动开聊', 'chat', false], ['招聘币', 'coins', true],
      ['极速聊', 'speed_chat', false], ['极速电话', 'speed_phone', false],
      ['折扣', 'discount', false], ['折扣卡', 'discount_cards', true],
      ['赠送职位点', 'bonus', true], ['名企标识', 'brand_hr', false],
      ['名企关键词', 'brand_kw', true], ['代招公司', 'agency', true],
    ];

    html += '<div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>对比项</th>';
    pkgs.forEach((p,i) => { html += `<th>方案${String.fromCharCode(65+i)}<br><span style="font-size:11px;font-weight:400;color:var(--text-3);">${p.name.substring(0,12)}</span></th>`; });
    html += '</tr></thead><tbody>';

    // Row: 售卖范围
    html += '<tr><td>售卖范围</td>';
    pkgs.forEach(p => { html += `<td>${p.tier}</td>`; });
    html += '</tr>';

    fields.forEach(([label, key, numeric]) => {
      const vals = pkgs.map(p => {
        const v = p[key];
        if (v === undefined || v === null || v === '/') return null;
        if (numeric && typeof v === 'string') {
          const n = parseFloat(v.replace(/[^0-9.]/g, ''));
          return isNaN(n) ? v : n;
        }
        return v;
      });
      const validVals = vals.filter(v => v !== null && v !== undefined);
      if (validVals.length === 0) return;

      let bestIdx = -1, highIdx = -1;
      if (numeric && validVals.every(v => typeof v === 'number')) {
        const max = Math.max(...validVals);
        const min = Math.min(...validVals);
        bestIdx = vals.indexOf(max);
        if (max !== min) highIdx = vals.indexOf(min);
      }

      html += `<tr><td><strong>${label}</strong></td>`;
      vals.forEach((v, i) => {
        const cls = i === bestIdx ? ' class="best"' : (i === highIdx ? ' class="highlight"' : '');
        html += `<td${cls}>${v !== null && v !== undefined ? v : '-'}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  // Coin comparison
  if (coins.length >= 2) {
    html += '<div style="margin-top:16px;overflow-x:auto;"><table class="compare-table"><thead><tr><th>对比项</th>';
    coins.forEach((p,i) => { html += `<th>档位${i+1}</th>`; });
    html += '</tr></thead><tbody>';
    html += '<tr><td>充值区间</td>' + coins.map(c => `<td>${c.range}</td>`).join('') + '</tr>';
    html += '<tr><td>返比</td>' + coins.map(c => `<td style="color:var(--accent);font-weight:700;">${c.rebate}</td>`).join('') + '</tr>';
    html += '<tr><td>有效期</td>' + coins.map(c => `<td>${c.validity}</td>`).join('') + '</tr>';
    html += '</tbody></table></div>';
  }

  html += '<div class="compare-legend"><span class="legend-best">绿色 = 该项最优</span><span class="legend-high">橙色 = 该项最低</span></div>';
  section.innerHTML = html;
}

// === EXCEL UPLOAD & EDITOR ===
function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  excelFileName = file.name;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const data = new Uint8Array(ev.target.result);
    parseExcelData(data);
  };
  reader.readAsArrayBuffer(file);
}

function parseExcelData(data) {
  // Use SheetJS from CDN if available, otherwise show message
  if (typeof XLSX === 'undefined') {
    loadSheetJS(() => parseExcelWithSheetJS(data));
  } else {
    parseExcelWithSheetJS(data);
  }
}

function loadSheetJS(callback) {
  const script = document.createElement('script');
  script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
  script.onload = callback;
  script.onerror = () => showToast('无法加载 Excel 解析库，请检查网络');
  document.head.appendChild(script);
}

function parseExcelWithSheetJS(data) {
  try {
    const workbook = XLSX.read(data, { type: 'array' });
    excelWorkbook = {};
    workbook.SheetNames.forEach(sheetName => {
      const ws = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      excelWorkbook[sheetName] = json;
    });

    // Show info
    const info = document.getElementById('excelInfo');
    const sheetCount = Object.keys(excelWorkbook).length;
    const rowCount = Object.values(excelWorkbook).reduce((sum, rows) => sum + rows.length, 0);
    info.style.display = 'block';
    info.innerHTML = `&#x2705; <strong>${excelFileName}</strong> (${sheetCount} 个工作表, ${rowCount} 行数据)`;
    document.getElementById('btnExcelEdit').style.display = 'block';
    showToast('Excel 导入成功！点击"编辑 Excel 数据"可查看和修改');
  } catch (err) {
    showToast('Excel 解析失败: ' + err.message);
  }
}

function openExcelEditor() {
  if (!excelWorkbook) { showToast('请先上传 Excel 文件'); return; }
  const modal = document.getElementById('excelEditorModal');
  const select = document.getElementById('editorSheetSelect');

  // Populate sheet selector
  const sheets = Object.keys(excelWorkbook);
  select.innerHTML = sheets.map((s, i) => `<option value="${s}">${s} (${excelWorkbook[s].length} 行)</option>`).join('');

  currentEditorSheet = sheets[0];
  renderEditorTable(currentEditorSheet);
  modal.classList.add('show');
}

function switchEditorSheet(sheetName) {
  currentEditorSheet = sheetName;
  renderEditorTable(sheetName);
}

function renderEditorTable(sheetName) {
  const container = document.getElementById('editorTableContainer');
  const rows = excelWorkbook[sheetName];
  if (!rows || rows.length === 0) { container.innerHTML = '<div style="padding:20px;color:var(--text-3);">无数据</div>'; return; }

  let html = '<table class="excel-editor-table"><thead><tr><th class="row-num">#</th>';
  // Header row
  const headerRow = rows[0];
  const colCount = Math.max(...rows.map(r => r.length));
  for (let c = 0; c < colCount; c++) {
    html += `<th>${headerRow[c] || 'Col ' + (c+1)}</th>`;
  }
  html += '</tr></thead><tbody>';

  // Data rows
  for (let r = 1; r < rows.length; r++) {
    html += `<tr><td class="row-num">${r+1}</td>`;
    for (let c = 0; c < colCount; c++) {
      const val = rows[r][c] !== undefined ? rows[r][c] : '';
      html += `<td><input type="text" value="${escapeHtml(val)}" data-row="${r}" data-col="${c}" onchange="updateExcelCell(this)"></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/"/g, '&quot;');
}

function updateExcelCell(input) {
  const r = parseInt(input.dataset.row);
  const c = parseInt(input.dataset.col);
  if (excelWorkbook[currentEditorSheet]) {
    excelWorkbook[currentEditorSheet][r][c] = input.value;
  }
}

function saveExcelChanges() {
  // In a real implementation, this would regenerate PKG_DATA from excelWorkbook
  // For now, we just show a success message
  showToast('数据已保存（演示模式：修改未同步到报价单，需重新生成）');
  closeExcelEditor();
}

function closeExcelEditor() {
  document.getElementById('excelEditorModal').classList.remove('show');
}

function resetAll() {
  selectedPkgs = []; uploadedImage = null; quoteVersion = 'simple';
  document.getElementById('clientName').value = '';
  document.getElementById('contactName').value = '';
  document.getElementById('clientPhone').value = '';
  document.getElementById('salesName').value = '';
  document.getElementById('clientRemark').value = '';
  document.getElementById('btnGenerate').disabled = true;
  setVersion('simple');
  updateSelectedPanel();
  document.querySelectorAll('.preset-img-thumb').forEach(t => t.classList.remove('active'));
  const area = document.getElementById('uploadArea');
  area.classList.remove('has-image');
  area.innerHTML = '<div class="upload-icon">&#x1F4F7;</div><div class="upload-text">点击或拖拽上传头图<br><strong>支持 JPG / PNG / JPEG</strong></div>';
  document.getElementById('fileInput').value = '';
  switchTab(currentTab);
  showToast('已重置所有选择');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
