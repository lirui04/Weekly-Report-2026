  :root {
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --accent-dark: #1d4ed8;
    --bg: #f8f9fb;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-hover: 0 4px 16px rgba(0,0,0,0.10), 0 8px 32px rgba(0,0,0,0.06);
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  [data-brand="ganji"] {
    --accent: #0d9488;
    --accent-light: #f0fdfa;
    --accent-dark: #0f766e;
  }
  [data-brand="zhixiaole"] {
    --accent: #7c3aed;
    --accent-light: #f5f3ff;
    --accent-dark: #6d28d9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 24px 32px;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--text-secondary);
    font-size: 15px;
  }

  /* Brand Tabs */
  .brand-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 24px 32px;
  }
  .brand-tab {
    padding: 10px 28px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }
  .brand-tab:hover { border-color: var(--accent); color: var(--accent); }
  .brand-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Brand Description */
  .brand-desc {
    text-align: center;
    padding: 0 24px 28px;
    max-width: 560px;
    margin: 0 auto;
  }
  .brand-desc .desc-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .brand-desc .desc-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Pricing Cards */
  .pricing-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }
  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    align-items: start;
    max-width: 1080px;
    margin: 0 auto;
  }
  .pricing-grid.cols-2 {
    grid-template-columns: repeat(2, 1fr);
    max-width: 560px;
  }
  .pricing-grid.cols-4 {
    grid-template-columns: repeat(4, 1fr);
    max-width: 1080px;
  }
  @media (max-width: 960px) {
    .pricing-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .pricing-grid { grid-template-columns: 1fr; }
  }

  .plan-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    padding: 28px 24px;
    position: relative;
    transition: var(--transition);
    cursor: pointer;
  }
  .plan-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .plan-card.featured {
    border-color: var(--accent);
    border-width: 2px;
    box-shadow: 0 0 0 1px var(--accent), var(--shadow);
  }
  .plan-card.featured .badge {
    display: inline-block;
  }
  .badge {
    display: none;
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 14px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .plan-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .plan-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .plan-price {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 4px;
  }
  .plan-price .currency {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .plan-price .amount {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .plan-price .period {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .plan-daily {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .plan-daily strong {
    color: var(--accent);
    font-weight: 600;
  }

  .plan-cta {
    display: block;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: var(--transition);
    text-align: center;
    margin-bottom: 20px;
  }
  .plan-cta:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .plan-card.featured .plan-cta {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .plan-card.featured .plan-cta:hover {
    background: var(--accent-dark);
  }

  .plan-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .plan-features li {
    font-size: 13.5px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }
  .plan-features li .icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    color: var(--accent);
    font-size: 14px;
  }

  /* Detail Panel */
  .detail-panel {

    margin: 0 auto 48px;
    padding: 0 24px;
  }
  .detail-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .detail-header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .detail-header h3 {

    font-weight: 600;
  }
  .detail-header .tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }
  .detail-body {
    padding: 0;
  }
  .detail-row {
    display: grid;
    grid-template-columns: 140px repeat(var(--cols, 4), 1fr);
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label {
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: #fafbfc;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
  }
  .detail-row .cell {
    padding: 14px 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    border-right: 1px solid var(--border);
  }
  .detail-row .cell:last-child { border-right: none; }
  .detail-row.highlight .cell {
    background: var(--accent-light);
  }
  .section-divider {
    background: var(--accent-light);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.5px;
  }
  .note-row {
    padding: 14px 20px;
    font-size: 12px;
    color: var(--text-secondary);
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
    line-height: 1.6;

  /* Effect Section */
  .effect-section {
    max-width: 1200px;
    margin: 0 auto 48px;
    padding: 0 24px;

  .effect-card {
    background: var(--card-bg);

    align-items: center;

  .effect-grid .eg-row-last .eg-label,
  .effect-grid .eg-row-last .eg-cell { border-bottom: none; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Animations */
  .fade-in {
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

function renderPricing(brand) {
  const data = DATA[brand];
  const grid = document.getElementById('pricingGrid');
  grid.innerHTML = data.plans.map((p, i) => `
    <div class="plan-card ${p.featured ? 'featured' : ''}" style="animation-delay:${i*0.08}s">
      <span class="badge">推荐</span>
      <div class="plan-name">${p.name}</div>
      <div class="plan-subtitle">${p.subtitle}</div>
      <div class="plan-price">
        <span class="currency">¥</span>
        <span class="amount">${p.price.toLocaleString()}</span>
        <span class="period">/${p.period}</span>
      </div>
      <div class="plan-daily">日均成本 <strong>¥${p.daily}</strong> · ${p.tagline}</div>
      <button class="plan-cta">${p.cta}</button>
      <ul class="plan-features">
        ${p.features.map(f => `<li><span class="icon">✦</span>${f}</li>`).join('')}
      </ul>
    </div>
  `).join('');
  grid.className = `pricing-grid cols-${data.plans.length} fade-in`;
}

function renderDetail(brand) {
  const data = DATA[brand];
  const card = document.getElementById('detailCard');
  const cols = data.plans.length;
  let html = `<div class="detail-header"><h3>权益对比详情</h3><span class="tag">2027 方案</span></div><div class="detail-body" style="--cols:${cols}">`;
  data.detail.rows.forEach(r => {
    if (r.section) {
      html += `<div class="section-divider">${r.section}</div>`;
    } else {
      const hl = r.highlight || [];
      const cells = r.cells.slice(0, cols);
      html += `<div class="detail-row${hl.some(Boolean) ? ' highlight' : ''}">`;
      html += `<div class="label">${r.label}</div>`;
      cells.forEach((c, i) => {
        html += `<div class="cell" style="${hl[i] ? 'background:var(--accent-light);font-weight:600' : ''}">${c || '—'}</div>`;
      });
      html += '</div>';
    }
  });
  html += '</div>';
  card.innerHTML = html;
  card.className = 'detail-card fade-in';
}

function renderEffect(brand) {
  const data = DATA[brand];
  const card = document.getElementById('effectCard');
  const cols = data.plans.length;
  let html = `<div class="effect-header"><h3>效果机制参考</h3></div>`;
  html += `<div class="effect-grid" style="--cols:${cols}">`;
  data.effect.rows.forEach(r => {
    const lastClass = r.isLast ? ' eg-row-last' : '';
    const cells = r.cells.slice(0, cols);
    html += `<div class="eg-label${lastClass}">${r.label}</div>`;
    cells.forEach((c) => {
      html += `<div class="eg-cell${lastClass}">${c || '—'}</div>`;
    });
  });
  html += '</div>';
  card.innerHTML = html;
  card.className = 'effect-card fade-in';
}

function switchBrand(brand) {
  document.body.setAttribute('data-brand', brand === 'boxiaole' ? 'boxiaole' : brand);
  document.querySelectorAll('.brand-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.target === brand);
  });
  const desc = DATA[brand].desc;
  document.getElementById('brandDesc').innerHTML =
    `<div class="desc-title">${desc.title}</div><div class="desc-text">${desc.text}</div>`;
  renderPricing(brand);
  renderDetail(brand);
  renderEffect(brand);
}

document.querySelectorAll('.brand-tab').forEach(tab => {
  tab.addEventListener('click', () => switchBrand(tab.dataset.target));
});

// Init
switchBrand('boxiaole');
</script>
